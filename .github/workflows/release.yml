name: Release Windows and Ubuntu

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Set release version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          node scripts/set-version.mjs $version

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Prepare Windows release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null

          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -File -Recurse -Filter '*.exe' |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $setup) {
            throw 'No Windows NSIS installer was generated.'
          }

          Copy-Item $setup.FullName "release-assets/huajian-xinzhi_${version}_x64-setup.exe"
          Copy-Item src-tauri/target/release/floral-notepaper.exe "release-assets/huajian-xinzhi_${version}_x64-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  build-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install dependencies
        run: npm ci

      - name: Set release version from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Build Ubuntu deb package
        run: npm run tauri build -- --bundles deb

      - name: Prepare Ubuntu release file
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          deb_path="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [[ -z "$deb_path" ]]; then
            echo 'No Ubuntu deb package was generated.' >&2
            exit 1
          fi
          cp "$deb_path" "release-assets/huajian-xinzhi_${version}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-ubuntu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum huajian-xinzhi_* > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="Docs/release-note/${version}.md"
          if [[ ! -f "$notes" ]]; then
            printf '花笺·新枝 %s，慢慢写，纸会记得。\n' "$version" > release-notes.md
            notes='release-notes.md'
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "花笺·新枝 $version" \
            --notes-file "$notes" \
            --latest
