name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Set release version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          node scripts/set-version.mjs $version

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null

          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -File -Recurse -Filter '*.exe' |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $setup) {
            throw 'No Windows NSIS installer was generated.'
          }

          Copy-Item $setup.FullName "release-assets/huajian-xinzhi_${version}_x64-setup.exe"
          Copy-Item src-tauri/target/release/floral-notepaper.exe "release-assets/huajian-xinzhi_${version}_x64-portable.exe"

          Get-FileHash release-assets/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $notes = "Docs/release-note/${version}.md"
          if (-not (Test-Path $notes)) {
            "花笺·新枝 ${version}，慢慢写，纸会记得。" | Set-Content release-notes.md
            $notes = 'release-notes.md'
          }

          $assets = Get-ChildItem release-assets -File | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" $assets `
            --title "花笺·新枝 $version" `
            --notes-file $notes `
            --latest
